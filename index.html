var xfer = {code:'', msg:''};
function b64FromBytes(bytes){ var s = ''; for(var i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
function bytesFromB64(b){ var s = atob(b), out = new Uint8Array(s.length); for(var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; }
function makeTransferCodeAsync(){
  var json = transferJSON();
  if(!window.CompressionStream) return Promise.resolve('NINJALIFE1:' + btoa(unescape(encodeURIComponent(json))));
  return new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer().then(function(buf){ return 'NINJALIFE2:' + b64FromBytes(new Uint8Array(buf)); },
    function(){ return 'NINJALIFE1:' + btoa(unescape(encodeURIComponent(json))); });
}
function readTransferCodeAsync(code){
  code = String(code || '').replace(/\s+/g, '');
  if(code.indexOf('NINJALIFE2:') === 0){
    if(!window.DecompressionStream) return Promise.reject('This browser is too old to read that code. Try a newer browser.');
    var bytes; try { bytes = bytesFromB64(code.slice(11)); } catch(e){ return Promise.reject('The code is incomplete or damaged. Copy the whole code and try again.'); }
    return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text().then(function(t){ return JSON.parse(t); }, function(){ throw 'The code is incomplete. It may have been cut off while copying. Copy the whole code and try again.'; });
  }
  if(code.indexOf('NINJALIFE1:') === 0){ try { return Promise.resolve(JSON.parse(decodeURIComponent(escape(atob(code.slice(11)))))); } catch(e){ return Promise.reject('The code is incomplete or damaged. Copy the whole code and try again.'); } }
  return Promise.reject(code ? 'That doesn’t look like a Ninja Life transfer code. It should start with NINJALIFE.' : 'Paste the code into the box first.');
}
function transferJSON(){
  var ix = migrateSlots(), saves = {};
  ix.list.forEach(function(s){ try { var t = localStorage.getItem(SAVE_KEY + ':' + s.id); if(t) saves[s.id] = JSON.parse(t); } catch(e){} });
  if(S && curSlot && !saves[curSlot]) saves[curSlot] = S;
  return JSON.stringify({app:'ninja-life', v:1, history:loadHistory(), slots:ix.list, saves:saves});
}
function importTransferData(data){
  if(!data || data.app !== 'ninja-life') return 'That code isn’t from Ninja Life.';
  var hist = loadHistory(), seen = {}, addedH = 0;
  hist.forEach(function(l){ seen[l.name + '|' + l.age + '|' + l.cause] = 1; });
  (data.history || []).forEach(function(l){ var k = l.name + '|' + l.age + '|' + l.cause; if(!seen[k]){ hist.push(l); seen[k] = 1; addedH++; } });
  try { localStorage.setItem(HIST_KEY, JSON.stringify(hist.slice(0, 200))); } catch(e){ return 'This browser ran out of storage space.'; }
  var ix = migrateSlots(), addedS = 0;
  (data.slots || []).forEach(function(s){ var sv = data.saves && data.saves[s.id]; if(!sv || ix.list.some(function(x){ return x.id === s.id; })) return;
    try { localStorage.setItem(SAVE_KEY + ':' + s.id, JSON.stringify(sv)); ix.list.push(Object.assign({}, s)); addedS++; } catch(e){} });
  slotsSave(ix);
  return 'Imported ' + addedH + ' past li' + (addedH === 1 ? 'fe' : 'ves') + ' and ' + addedS + ' saved li' + (addedS === 1 ? 'fe' : 'ves') + '.' + (addedH + addedS === 0 ? ' You already had everything in that code.' : '');
}
function sheetTransfer(){

  h += '<div class="group"><h3>1. Make a code from this copy</h3><button class="primary" type="button" data-xfer="make">Make a transfer code</button>' +
    (xfer.busy ? '<p class="k-cmd">Making your code…</p>' : '') +
    (xfer.code ? '<p class="k-cmd" style="margin:10px 0 4px">Your code is ' + xfer.code.length.toLocaleString() + ' characters long. Copy all of it.</p><textarea class="t" id="xferOut" rows="4" style="font-size:.72rem;width:100%">' + esc(xfer.code) + '</textarea><button class="primary" type="button" data-xfer="copy" style="margin-top:8px">Copy the code</button>' : '') + '</div>';
  h += '<div class="group"><h3>Or use your own code word</h3><p class="k-cmd" style="margin:0 0 8px">Pick a word like kenji-life. Only you can load it: it’s saved privately to your claude.ai account, so it works between your devices on claude.ai, not with a downloaded copy.</p>' +

  h += '<div class="group"><h3>2. Paste a code from another copy</h3><textarea class="t" id="xferIn" rows="4" placeholder="Paste the transfer code here" style="font-size:.72rem;width:100%"></textarea><button class="primary" type="button" data-xfer="import" style="margin-top:8px">Import lives</button></div>';
  if(xfer.msg) h += '<p class="' + (/^(Imported|Copied|Saved under)/.test(xfer.msg) ? 'k-good' : /^(Importing|Saving|Loading)/.test(xfer.msg) ? 'k-cmd' : 'k-bad') + '">' + esc(xfer.msg) + '</p>';

}


/* ================= YOUR OWN CODE WORD (claude.ai storage, private to your account) ================= */
var xdbState = null;
function xferDB(){
  if(xdbState) return xdbState;
  xdbState = (!window.claude || !window.claude.use) ? Promise.resolve(null) :
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(r){ var db = r[0], u = r[1]; if(!db || !u) return null; return u.id().then(function(id){ return id ? {db:db, uid:id} : null; }); }).catch(function(){ return null; });
  return xdbState;
}
function cleanWord(w){ return String(w || '').trim().toLowerCase().replace(/\s+/g, '-'); }
function wordProblem(w){ if(w.length < 3) return 'Your code word needs at least 3 characters.'; if(w.length > 30) return 'Keep your code word to 30 characters or fewer.'; if(!/^[a-z0-9-]+$/.test(w)) return 'Use only letters, numbers and dashes in your code word.'; return ''; }
function wordDoc(d, w, part){ return d.db.collection('data/users/' + d.uid).doc('xfer-' + w + (part == null ? '' : '-' + part)); }
function saveUnderWord(w){
  return xferDB().then(function(d){
    if(!d) throw 'Code words only work in the claude.ai version of the game while you’re signed in. Use the long code instead.';
    return makeTransferCodeAsync().then(function(code){
      var parts = []; for(var i = 0; i < code.length; i += 200000) parts.push(code.slice(i, i + 200000));
      var chain = Promise.resolve();
      parts.forEach(function(p, i){ chain = chain.then(function(){ return wordDoc(d, w, i).set({chunk:p}); }); });
      return chain.then(function(){ return wordDoc(d, w).set({parts:parts.length, size:code.length, savedAt:Date.now()}); })
        .then(function(){ return 'Saved under “' + w + '”. On any device signed in to this claude.ai account, open the game, go to ☰ → Move your lives, type ' + w + ' and tap Load.'; });
    });
  });
}
function loadFromWord(w){
  return xferDB().then(function(d){
    if(!d) throw 'Code words only work in the claude.ai version of the game while you’re signed in. Use the long code instead.';
    return wordDoc(d, w).get().then(function(head){
      if(!head.exists) throw 'Nothing is saved under “' + w + '” on this account. Check the spelling, or save it first on the other device.';
      var n = head.data().parts || 0, got = [], chain = Promise.resolve();
      for(var i = 0; i < n; i++) (function(i){ chain = chain.then(function(){ return wordDoc(d, w, i).get().then(function(s){ if(!s.exists) throw 'Part of that save is missing. Save it again on the other device.'; got.push(s.data().chunk); }); }); })(i);
      return chain.then(function(){ return readTransferCodeAsync(got.join('')); }).then(importTransferData);
    });
  });
}
function xferErr(e){ return typeof e === 'string' ? e : (e && e.code === 'quota_exceeded') ? 'Your claude.ai storage for this game is full.' : (e && e.code === 'resource_exhausted') ? 'Too many tries at once. Wait a moment and try again.' : 'That didn’t work. Check your connection and try again.'; }

/* ================= EXEC ================= */
function optMatch(name){ return !!(S.pending && S.pending.options.some(function(o){ return o === '/' + name || o.indexOf('/' + name + ' ') === 0; })); }
function exec(raw, quiet){
  if(!S) return;
  var txt = String(raw).trim();
  if(!txt) return;
  if(txt.charAt(0) === '/') txt = txt.slice(1);
  var parts = txt.split(/\s+/), name = parts[0].toLowerCase(), args = parts.slice(1);
  if(name === 'kill') name = 'murder';
  var c = CMDS[name];
  if(!c){ warn('“/' + name + '” isn’t a command. Type /help to see what you can do.'); return; }
  if(!S.alive && !c.dead){ warn('Your life has ended. Start a new life or continue as your child.'); return; }
  if(S.battle && !c.battle && !c.free){ warn(S.battle.over ? 'Tap Continue to leave the fight.' : 'Finish the fight first: strike, use a jutsu, defend or flee.'); renderBattle(); return; }
  if(S.mini && !c.mini && !c.free){ warn('Finish the game first.'); renderMini(); return; }
  if(S.pending && S.pending.block && !optMatch(name) && !c.free && !c.battle && !c.mini){ warn('Choose one of the options first.'); renderPop(); return; }
  if(S.prison > 0 && !c.prison && !c.free && !c.battle && !optMatch(name)){ warn('You’re in prison. Try /escape, /behave or /age_up.'); return; }
  if(S.flags.dream && !c.free && !c.battle && !c.mini && ['Academy and Exams','Missions','Work and Business','Kage','Organizations'].indexOf(c.cat) >= 0 && name !== 'leave_org'){ warn('The whole world is asleep in your Infinite Tsukuyomi. Release it first with /release_infinite_tsukuyomi.'); return; }
  if(c.when){ var w = c.when(); if(w !== true){ warn(w); return; } }
  if(c.limit && (S.used[name] || 0) >= c.limit){ warn('You’ve used /' + name + ' ' + (c.limit === 1 ? 'already' : c.limit + ' times') + ' this year. Age up to do it again.'); return; }
  var isChoice = S.pending && S.pending.block && optMatch(name);
  if(c.cost > 0 && S.energy < c.cost && !isChoice){ warn('Not enough energy. /' + name + ' needs ' + c.cost + ' and you have ' + S.energy + '.'); return; }
  if(S.pending && !S.pending.block && S.pending.options.indexOf('/' + name + (args.length ? ' ' + args.join(' ') : '')) < 0 && S.pending.options.indexOf('/' + name) < 0 && !c.free) S.pending = null;
  var before = S.pending;
  if(!c.free && !quiet && !c.hidden && name !== 'age_up') say('/' + name + (args.length ? ' ' + args.join(' ') : ''), 'k-cmd');
  var res = c.run(args);
  if(res === false){ removeEchoIfLast(name); render(); return; }
  if(c.cost > 0) S.energy = Math.max(0, S.energy - c.cost);
  if(c.cost < 0) S.energy = Math.min(maxE(), S.energy - c.cost);
  if(S.org === 'Root') S.happy = Math.min(S.happy, 40);
  if(c.limit) S.used[name] = (S.used[name] || 0) + 1;
  if(before && S.pending === before && (before.options.indexOf('/' + name) >= 0 || before.options.some(function(o){ return o.indexOf('/' + name + ' ') === 0; }))) S.pending = null;
  readyTaught();
  flushQueue();
  save(); render();
}
function removeEchoIfLast(name){ var e = entry(); var last = e.items[e.items.length-1]; if(last && last.k === 'k-cmd' && last.t.indexOf('/' + name) === 0) e.items.pop(); }

function sheetHelp(){
  var h = head('How to play');
  h += '<div class="help"><p>Tap <b>Age +1</b> to live through a year. Each year you can type commands in the bar (like <code>/eat_ramen</code>) or tap them in Activities.</p>' +
    '<p>Your energy refills every time you age up. Your max starts at 1,000 and drops by 10 every year you age, so older ninja can do less. Food, rest and the hospital give some energy back during a year.</p>' +
    '<p>Enroll in the Academy at 6, pass the graduation exam and the survival test to become a Genin, then take missions and the Chunin Exam to rise through the ranks.</p>' +
    '<p>New: become a jinchuriki, join Orochimaru (/seek_orochimaru) or the Military Police, found your own organization, invent jutsu with high Smarts, play blackjack, and lead wars from the Kage desk. Past lives are saved on the start screen.</p>' +
    '<p>Open anyone’s Stats card, in People or Groups, to talk, spar or fight them. Canon characters you talk to join your People list, and killing them changes history. Random events can happen any year, including ambushes where you start hurt and low on chakra.</p>' +
    '<p>Fights happen on B-rank and harder missions, in the Chunin Exam finals, when you spar, and in violent crimes. Use jutsu that cost chakra, strike for free, defend to recover chakra, flee, or tap Auto to finish fast. Using a jutsu in battle also raises its mastery.</p>' +
    '<p>Big moments now come up as pop-ups. Ambushes, wars and disasters give you a choice to fight or run, so only true one-shot moments, like an exploding tag at your feet, can end your life on the spot, and even those give you a chance to survive.</p>' +
    '<p>Tap your face next to your name to customize it. Talk to anyone and Claude answers as that person, in character. Missions play a mini-game that matches the task. Find a home on the /housing_market (orphans are supported by the Kage until 18), lead your clan, join the Border Team, and ask Orochimaru for Hashirama’s cells. The Mangekyo must be earned through loss, and each one holds its own powers. Stolen Mangekyo eyes keep their owner’s powers, and an Eternal Mangekyo combines both. You can hold two different dojutsu, one per eye. The Rinnegan only awakens in someone who carries both Indra’s and Asura’s chakra. Jonin is the highest rank you can apply for, and the Kage is chosen by invitation.</p>' +
    '<p>Signature jutsu like Chidori and Rasengan can only be learned from the people who know them (Ask to teach on their card) or from scrolls they left behind (/search_for_scrolls). Hunt the nine tailed beasts to create the Ten-Tails, keep stolen eyes in your /eye_collection, talk to opponents mid-fight, and once you pass about 38 power, take on legends with /challenge_legend.</p>' +
    '<p>Fight in the Great Ninja Wars with /fight_in_war, visit or move to other villages with /travel, and ask your Kage to name you successor with /request_succession. Clan heads can meet the Kage, the elders and other clans, or stage a coup. Reincarnations of Indra or Asura can /meet_hagoromo. The Reanimation Jutsu needs the person’s remains and a living sacrifice. At about 40 power, you can wage war on a nation alone with /declare_personal_war.</p>' +
    '<p>Arrests come as a fight: you can resist, surrender or run. You can ask canon characters out (both of you must be 14+, adults only date adults, and teens stay within 3 years of each other). Invite people to your organization from their card. Train your children and teach them jutsu so they inherit it, and name an heir. Buy pills with /buy_supplement and use them in battle. Sealing jutsu let you seal tailed beasts; reverse sealing pulls them out of a jinchuriki.</p>' +
    '<p>People now come to you to talk. Confront the ANBU watching you with /confront_anbu. Invent jutsu by describing them with /develop_jutsu (100 Smarts or Prodigy). Find out who knows a signature jutsu at the /visit_library. Lower notoriety with /community_service or /bribe_officials, and Hatred with /visit_graves; both also fade over quiet, happy years. Running your chakra dry in a fight can leave you badly hurt.</p>' +
    '<p>The ☰ menu has the main menu, settings and quit, and the main menu holds all your saved lives. With a working Sharingan you can copy jutsu enemies use on you. The winner of a fight gets the last word. Hunt the Seven Swords of the Mist with /claim_mist_sword, decorate your home with /decorate_home, and hide or forget jutsu from the jutsu browser.</p>' +
    '<p>Talk to several people at once with /group_chat. Beat someone with a dojutsu and you can take their eyes from their People card. The stronger you grow for your age, the more weaker people fear you. As Kage, /special_orders lets you order assassinations, spy missions and more; organization leaders get /syndicate_contract. ANBU, Root and Akatsuki missions now brief you and assign a team.</p>' +
    '<p>Adults can drink at the bar with /go_to_bar for +100 energy and −5 health, and sometimes meet people there. As Kage, you sign or veto new laws and have bodyguards. What people agree to in conversation really happens, like a Kage pardoning you. Your face wears your organization’s uniform, and founders can design their own. In prison you can train, read, work, appeal, make friends, fight for respect and plan a breakout. Know Hidan well enough, and he can bring you into the religion of Jashin.</p>' +
    '<p>Year 0 is the year Naruto was born. War dates before that are approximate, since canon never gives exact years.</p></div>';
  CAT_ORDER.forEach(function(cat){
    var list = Object.keys(CMDS).map(function(k){ return CMDS[k]; }).filter(function(c){ return c.cat === cat && !c.hidden; });
    if(!list.length) return;
    h += '<div class="group"><h3>' + cat + '</h3>' + list.map(function(c){
      var cost = c.name === 'age_up' ? 'refills' : (c.cost > 0 ? '-' + c.cost : (c.cost < 0 ? '+' + (-c.cost) : '0'));

  return h;
}

  $('#cBeast').innerHTML = '<option value="">None</option>' + Object.keys(BEASTS).map(function(b){ return '<option value="' + b + '">' + b + ' (' + BEASTS[b] + ')</option>'; }).join('');
  [['#cTalent','#oTalent'],['#cSmarts','#oSmarts'],['#cLooks','#oLooks']].forEach(function(pr){ $(pr[0]).addEventListener('input', function(){ $(pr[1]).textContent = $(pr[0]).value; }); });
  $('#customToggle').addEventListener('click', function(){ ui.custom = !ui.custom; $('#customBox').hidden = !ui.custom; $('#customToggle').setAttribute('aria-expanded', String(ui.custom)); $('#customToggle').textContent = ui.custom ? 'Use random birth instead' : 'Customize everything'; });
}
function initStart(){
  initCustom();
  $('#fVillage').innerHTML = '<option value="Random">Random (weighted)</option>' + VILLAGES.map(function(v){ return '<option>' + v + '</option>'; }).join('');
  $('#fEra').addEventListener('click', function(e){ var b = e.target.closest('[data-era]'); if(!b) return; ui.era = b.getAttribute('data-era'); renderEras(); });
  $('#fGender').addEventListener('click', function(e){ var b = e.target.closest('[data-g]'); if(!b) return; ui.gender = b.getAttribute('data-g');
    Array.prototype.forEach.call($('#fGender').children, function(x){ x.setAttribute('aria-pressed', String(x === b)); }); });
  $('#rollName').addEventListener('click', function(){ $('#fName').value = randGiven(ui.gender); });
  $('#beginBtn').addEventListener('click', function(){
    var era = ERAS.find(function(e){ return e.id === ui.era; });
    var v = $('#fVillage').value;
    if(v === 'Land of Whirlpools' && era.year > -19){ warn('The Land of Whirlpools is gone by this era. Pick an earlier era or another village.'); return; }
    var given = ($('#fName').value || '').trim().split(/\s+/)[0] || randGiven(ui.gender);
    var opts = {era:era, village:v, gender:ui.gender, given:given.charAt(0).toUpperCase() + given.slice(1)};
    if(ui.custom){
      var cv = $('#cClan').value;
      if(cv !== 'random') opts.clan = cv === '' ? null : cv;
      opts.custom = {kg:cu.kg.slice(), natures:cu.nat.slice(), traits:cu.traits.slice(), talent:+$('#cTalent').value, smarts:+$('#cSmarts').value, looks:+$('#cLooks').value, family:$('#cFamily').value, wealth:$('#cWealth').value, hair:$('#cHair').value, eyes:$('#cEyes').value, beast:$('#cBeast').value, reinc:$('#cReinc').value || null};
    }
    newSlot(); createLife(opts);
    $('#start').hidden = true; save(); render();
  });
  $('#slotList').addEventListener('click', function(e){
    var pl = e.target.closest('[data-slot-play]'), dl = e.target.closest('[data-slot-del]');
    if(pl){ var sv = loadSave(pl.getAttribute('data-slot-play')); if(sv){ S = normalize(sv); $('#start').hidden = true; kakashiFix(); render(); if(!S.alive) openSheet('death'); } return; }
    if(dl){ if(dl.getAttribute('data-armed')){ deleteSlot(dl.getAttribute('data-slot-del')); renderSlots(); } else { dl.setAttribute('data-armed', '1'); dl.textContent = 'Tap again to delete'; } }
  });
  $('#xferBtn').addEventListener('click', function(){ histFromStart = true; xfer = {code:'', msg:''}; $('#start').hidden = true; openSheet('transfer'); });
  $('#pastBtn').addEventListener('click', function(){ histFromStart = true; $('#start').hidden = true; openSheet('history'); });
  $('#continueBtn').addEventListener('click', function(){ var sv = loadSave(); if(sv){ S = normalize(sv); $('#start').hidden = true; kakashiFix(); render(); } });
}

/* ================= EVENTS ================= */
function wire(){
  $('#cmdForm').addEventListener('submit', function(e){ e.preventDefault(); var v = $('#cmd').value; $('#cmd').value = ''; exec(v); });
  $('#ageBtn').addEventListener('click', function(){ exec('age_up'); });
  $('#nav').addEventListener('click', function(e){ var b = e.target.closest('[data-sheet]'); if(!b || !S) return; openSheet(b.getAttribute('data-sheet')); });
  $('#pop').addEventListener('click', function(e){
    if(!S) return;
    var b = e.target.closest('[data-pcmd]');
    if(b){ var e0 = entry(), n0 = e0 ? e0.items.length : 0, ll = S.log.length; popOutcome = null; exec(b.getAttribute('data-pcmd')); captureOutcome(e0, n0, ll); return; }
    if(e.target.closest('[data-plater]')){ S.pending = null; save(); render(); return; }
    if(e.target.closest('[data-pok]')){ popOutcome = null; renderPop(); flushQueue(); render(); }
  });
  $('#faceBtn').addEventListener('click', function(){ if(S) openSheet('face'); });
  $('#menuBtn').addEventListener('click', function(){ if(S) openSheet('menu'); });
  $('#sheet').addEventListener('input', function(e){ if(e.target.id !== 'actSearch') return; var q = e.target.value.toLowerCase().trim();
    document.querySelectorAll('#sheetPanel .act[data-q]').forEach(function(b){ b.style.display = (!q || b.getAttribute('data-q').indexOf(q) >= 0) ? '' : 'none'; });
    document.querySelectorAll('#sheetPanel .actcat').forEach(function(g){ g.style.display = [].some.call(g.querySelectorAll('.act[data-q]'), function(b){ return b.style.display !== 'none'; }) ? '' : 'none'; });
    if(q) document.querySelectorAll('#sheetPanel details.actgroup').forEach(function(d){ d.open = true; }); });
  $('#sheet').addEventListener('change', function(e){ if(e.target.id !== 'actAvail') return; S.flags.onlyAvail = e.target.checked; var w = document.querySelector('#sheetPanel .actwrap'); if(w) w.classList.toggle('only-avail', e.target.checked); save(); });
  $('#sheet').addEventListener('submit', function(e){
    if(e.target.id === 'invForm'){ e.preventDefault(); inv.name = document.getElementById('invName').value; inv.type = document.getElementById('invType').value; inv.desc = document.getElementById('invDesc').value; evaluateInvention(); return; }
    if(e.target.id === 'gcForm'){ e.preventDefault(); if(gchat.busy){ if(gchat.ctl) gchat.ctl.abort(); gchat.busy = false; rerenderGC(); return; } var gi = document.getElementById('gcIn'); gcSend(gi ? gi.value : ''); return; }
    if(e.target.id !== 'chatForm') return;
    e.preventDefault();
    if(chat.busy){ if(chat.ctl) chat.ctl.abort(); return; }
    var i = document.getElementById('chatIn'); sendChat(i ? i.value : '');
  });
  $('#sheet').addEventListener('click', function(e){
    if(e.target.closest('[data-hist]')){ openSheet('history'); return; }
    var xf = e.target.closest('[data-xfer]'); if(xf){ var xa = xf.getAttribute('data-xfer');
      if(xa === 'make'){ xfer.busy = true; xfer.code = ''; xfer.msg = ''; openSheet('transfer');
        makeTransferCodeAsync().then(function(c){ xfer.busy = false; xfer.code = c; if(sheetKind === 'transfer') openSheet('transfer'); }); return; }
      if(xa === 'copy'){ var xo = $('#xferOut'), ok = false;
        if(xo){ xo.focus(); xo.select(); try { xo.setSelectionRange(0, xo.value.length); } catch(er){} try { ok = document.execCommand('copy'); } catch(er){ ok = false; } }
        var after = function(good){ xfer.msg = good ? 'Copied all ' + xfer.code.length.toLocaleString() + ' characters! Now open the other copy and paste it there.' : 'Your browser blocked automatic copying. The code is selected: copy it with Ctrl+C (Cmd+C on a Mac), or press and hold on a phone and choose Copy.'; var keep = xfer.code; openSheet('transfer'); var x2 = $('#xferOut'); if(x2 && !good){ x2.focus(); x2.select(); } };
        if(ok) after(true); else { try { navigator.clipboard.writeText(xfer.code).then(function(){ after(true); }, function(){ after(false); }); } catch(er){ after(false); } }
        return; }
      if(xa === 'saveword' || xa === 'loadword'){ var wi = $('#xferWord'), w = cleanWord(wi ? wi.value : ''), wp = wordProblem(w); xfer.word = w; xfer.code = '';
        if(wp){ xfer.msg = wp; openSheet('transfer'); return; }
        xfer.msg = xa === 'saveword' ? 'Saving…' : 'Loading…'; openSheet('transfer');
        (xa === 'saveword' ? saveUnderWord(w) : loadFromWord(w)).then(function(m){ xfer.msg = m; }, function(e){ xfer.msg = xferErr(e); }).then(function(){ renderSlots(); if(sheetKind === 'transfer') openSheet('transfer'); }); return; }
      if(xa === 'import'){ var xi = $('#xferIn'), val = xi ? xi.value : ''; xfer.msg = 'Importing…'; openSheet('transfer');
        readTransferCodeAsync(val).then(function(data){ xfer.msg = importTransferData(data); }, function(err){ xfer.msg = typeof err === 'string' ? err : 'The code is incomplete or damaged. Copy the whole code and try again.'; })
          .then(function(){ xfer.code = ''; renderSlots(); openSheet('transfer'); }); return; } }
    var mn = e.target.closest('[data-menu]'); if(mn){ var mv2 = mn.getAttribute('data-menu'); if(mv2 === 'settings'){ openSheet('settings'); return; } if(mv2 === 'transfer'){ xfer = {code:'', msg:''}; openSheet('transfer'); return; } save(); closeSheet(); startScreen(); if(mv2 === 'quit') warn('Your life is saved. You can close this page any time.'); return; }
    var sb = e.target.closest('[data-sheet-back]'); if(sb){ openSheet(sb.getAttribute('data-sheet-back')); return; }
    var ss = e.target.closest('[data-set]'); if(ss){ var key = ss.getAttribute('data-set'); S.settings = S.settings || {miniGames:true};
      if(key === 'miniGames') S.settings.miniGames = S.settings.miniGames === false; else if(key === 'ai'){ S.settings.noAI = !S.settings.noAI; sampleFn = S.settings.noAI ? null : sampleBackup; } else if(key === 'outcome') S.settings.noOutcome = !S.settings.noOutcome; else if(key.indexOf('text:') === 0){ S.settings.text = key.slice(5); applyText(); }
      save(); openSheet('settings'); return; }
    var hc = e.target.closest('[data-hcell]'); if(hc){ var pr = myHome(); if(!pr) return; var xy = hc.getAttribute('data-hcell').split(','), x = +xy[0], y = +xy[1], fi = furnAt(pr, x, y);
      if(fi >= 0) homeSel = homeSel === fi ? null : fi; else if(homeSel != null && pr.furn[homeSel]){ pr.furn[homeSel].x = x; pr.furn[homeSel].y = y; homeSel = null; save(); }
      openSheet('home'); return; }
    if(e.target.closest('[data-hrem]')){ var pr2 = myHome(); if(pr2 && homeSel != null){ pr2.furn.splice(homeSel, 1); homeSel = null; save(); } openSheet('home'); return; }
    var jh = e.target.closest('[data-jhide]'); if(jh){ var hn = jh.getAttribute('data-jhide'), sch = $('#sheetPanel').scrollTop; S.hiddenJ = S.hiddenJ || []; var hi = S.hiddenJ.indexOf(hn); if(hi >= 0) S.hiddenJ.splice(hi, 1); else S.hiddenJ.push(hn); save(); openSheet('jutsu'); $('#sheetPanel').scrollTop = sch; return; }
    var jf = e.target.closest('[data-jforget]'); if(jf){ evChoice('forget', 'Forget ' + jf.getAttribute('data-jforget') + '? You’ll lose all your mastery of it.', ['Forget it','Keep it'], {n:jf.getAttribute('data-jforget')}, 'Forget a jutsu'); render(); return; }
    var jt = e.target.closest('[data-jtab]'); if(jt){ jsv.tab = jt.getAttribute('data-jtab'); openSheet('jutsu'); return; }
    var jb = e.target.closest('[data-jby]'); if(jb){ var scj = $('#sheetPanel').scrollTop; jsv.by = jb.getAttribute('data-jby'); openSheet('jutsu'); $('#sheetPanel').scrollTop = scj; return; }
    var jr = e.target.closest('[data-jrun]'); if(jr){ var scr = $('#sheetPanel').scrollTop; exec(jr.getAttribute('data-jrun')); if(S.alive && !S.pending){ openSheet('jutsu'); $('#sheetPanel').scrollTop = scr; } return; }
    var fc = e.target.closest('[data-face]');
    if(fc){ var kv = fc.getAttribute('data-face'), ix = kv.indexOf(':'), key = kv.slice(0, ix), val = kv.slice(ix + 1), sc = $('#sheetPanel').scrollTop;
      if(key === 'random') S.face = defaultFace(true); else if(key === 'reset') S.face = defaultFace(); else if(key === 'swap') ensureFace().swap = !ensureFace().swap; else if(['ob','oa','op','oc'].indexOf(key) >= 0 && S.myOrg){ S.myOrg.outfit = S.myOrg.outfit || {c:'#2B3352', a:'#C9CFDA', p:'plain', collar:'normal'}; S.myOrg.outfit[{ob:'c', oa:'a', op:'p', oc:'collar'}[key]] = val; } else ensureFace()[key] = val;
      save(); render(); openSheet('face'); $('#sheetPanel').scrollTop = sc; return; }
    var sy = e.target.closest('[data-say]'); if(sy){ sendChat(sy.getAttribute('data-say')); return; }
    var gp = e.target.closest('[data-gcpick]'); if(gp){ var gid = +gp.getAttribute('data-gcpick'), gx = gchat.ids.indexOf(gid); if(gx >= 0) gchat.ids.splice(gx, 1); else if(gchat.ids.length < 5) gchat.ids.push(gid); openSheet('groupchat'); return; }
    if(e.target.closest('[data-gcstart]')){ if(gchat.ids.length >= 2){ gchat.picking = false; gchat.log = []; openSheet('groupchat'); } return; }
    if(e.target.closest('[data-gcadd]')){ gchat.picking = true; openSheet('groupchat'); return; }
    if(e.target === $('#sheet') || e.target.closest('[data-close]')){ if(sheetKind === 'death' && e.target === $('#sheet')) return; if(sheetKind === 'history' && S && !S.alive && !histFromStart){ openSheet('death'); return; } closeSheet(); if(histFromStart){ histFromStart = false; $('#start').hidden = false; renderSlots(); } return; }
    if(e.target.closest('[data-newlife]')){ startScreen(); return; }
    var tab = e.target.closest('[data-tab]'); if(tab){ openSheet(tab.getAttribute('data-tab'), tab.getAttribute('data-tab') === 'groups' ? groupV : undefined); return; }
    var card = e.target.closest('[data-card]'); if(card){ if(sheetKind !== 'card') sheetBack = sheetKind; lastCard = card.getAttribute('data-card'); openSheet('card', card.getAttribute('data-card')); return; }
    var back = e.target.closest('[data-back]'); if(back){ var bk = back.getAttribute('data-back'); openSheet(bk, bk === 'groups' ? groupV : undefined); return; }
    var gv = e.target.closest('[data-gv]'); if(gv){ groupV = gv.getAttribute('data-gv'); openSheet('groups', groupV); return; }
    var sub = e.target.closest('[data-sub]'); if(sub){ openSheet('acts', sub.getAttribute('data-sub')); return; }
    var r = e.target.closest('[data-run]');
    if(r){
      var cmd = r.getAttribute('data-run');
      var keep = sheetKind;
      exec(cmd);
      if(cmd.indexOf('continue_as_child') === 0 || sheetKind !== keep) return;
      if(S && S.battle){ closeSheet(); renderBattle(); return; }
      if(S && !S.alive){ openSheet('death'); return; }
      if(keep === 'people') openSheet('people'); else if(keep === 'card' && lastCard) openSheet('card', lastCard); else closeSheet();
    }
  });
  $('#mini').addEventListener('click', function(e){ var b = e.target.closest('[data-mcmd]'); if(!b) return; exec(b.getAttribute('data-mcmd')); });
  $('#battle').addEventListener('submit', function(e){ if(e.target.id !== 'btalk') return; e.preventDefault(); var i = document.getElementById('btalkIn'), v = i ? i.value.trim().slice(0, 160) : ''; if(!v || !S.battle || S.battle.speaking || (S.battle.over && (S.battle.over !== 'win' || S.battle.finalSaid))) return; i.value = ''; blog('You: “' + v + '”', 'k-say'); if(S.battle.over){ S.battle.finalSaid = true; foeSpeak(S.battle, 'defeated', v); } else foeSpeak(S.battle, 'reply', v); renderBattle(); save(); });
  $('#battle').addEventListener('click', function(e){ var b = e.target.closest('[data-bcmd]'); if(!b) return; exec(b.getAttribute('data-bcmd')); if(S && !S.battle){ renderBattle(); if(!S.alive) openSheet('death'); } });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      if(!$('#pop').hidden && S){ if(popOutcome && !S.pending){ popOutcome = null; renderPop(); flushQueue(); render(); return; } if(S.pending && !S.pending.block){ S.pending = null; save(); render(); return; } }
      if(!$('#sheet').hidden && sheetKind !== 'death') closeSheet();
      return;
    }
    var dir = {ArrowUp:'go_up', ArrowDown:'go_down', ArrowLeft:'go_left', ArrowRight:'go_right'}[e.key];
    if(dir && S && S.mini && (S.mini.type === 'dog' || S.mini.type === 'cat' || S.mini.type === 'forest') && !S.mini.over && document.activeElement !== $('#cmd')){ e.preventDefault(); exec(dir); }
  });
  $('#cmdList').innerHTML = Object.keys(CMDS).filter(function(k){ return !CMDS[k].hidden; }).map(function(k){ return '<option value="/' + k + '">'; }).join('');
}

initStart();
wire();
var saved = loadSave();
if(saved && saved.v === 1){
  S = normalize(saved);
  $('#start').hidden = true;
  kakashiFix();
  render();
  if(!S.alive) openSheet('death');
} else {
  startScreen();
}
window.__ninja = {exec:exec, get S(){ return S; }, createLife:createLife, ERAS:ERAS};
})();
</script>
